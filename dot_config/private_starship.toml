[directory]
truncation_length = 0
# style = "#32afff"
# read_only = " [ro] "
# style = "#719fcd"
# catppuccin mocha palette
#style = "#b4befe"
# style = "bold lavender"
# read_only = "  "
# read_only = " 🔒 "
# read_only = " X "
# read_only_style = "red"
# style = "#b4befe"
### style = "italic #719fcd"
style = "blue"
read_only = " [ro] "
read_only_style = "italic dimmed bright-black"
# truncate_to_repo = false

[git_branch]
format = "[$symbol $branch ]($style)"
style = "bright-black"
# symbol = "git "
# style = "bold #77216F"
###style = "#77216F"
# catppuccin mocha palette
#style = "bold #fab387"
# style = "bold #77216F"
# catppuccin mocha palette
#style = "bold #fab387"
symbol = ""

[git_status]
# $conflicted$stashed$deleted$renamed$modified$staged$untracked
# style = "purple"
# style="bright-yellow"
# style="#fd791f"
# style="bold #e38f1f"
# style="bold #ED764D"
# style="bold #F08763"
#style = "#E95420"
# style = "bold #77216F"
# style = "#77216F"
# style = "cyan"
style = "red"
# conflicted = "="
conflicted = "✖"
# ahead = "⇡$count"
ahead = "↑$count"
# behind = "⇣$count"
behind = "↓$count"
#diverged = "⇕"
# diverged = "⇕⇡${ahead_count}⇣${behind_count}"
diverged = "⇕↑${ahead_count}↓${behind_count}"
up_to_date = ""
# up_to_date = "✔"
#untracked = "?$count"
untracked = "…$count"
#stashed = "$"
stashed = "↩"
# modified = "!$count"
modified = "✚$count"
# staged = "+$count"
# staged = "→$count"
staged = "●$count"
renamed = "»$count"
# renamed = "➟$count"
deleted = "✘$count"
#style = "#46304a"
#style = "#8b6083"
#style = "#7d5676"
#style = "#805e79"
#staged = '[$count ](green)'
#ahead = "⇡${count}"
#diverged = "⇕⇡${ahead_count}⇣${behind_count}"
#behind = "⇣${count}"

# [jobs]
# symbol = "+ "

[python]
# symbol = " "
symbol = " "
# symbol = "py "
detect_extensions = []
detect_files = [
  ".python-version",
  "Pipfile",
  "__init__.py",
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "tox.ini",
  "manage.py",
]
pyenv_version_name = true
#style = "#94e2d5 bold"

# [shlvl]
# disabled = false
# # disabled = true
# symbol = "↕ "
# #symbol = " "
# threshold = 3

[shlvl]
disabled = false
format = '[$symbol]($style)'
repeat = true
symbol = '❯'
repeat_offset = 2            # niri session starts from a shell

[status]
disabled = false
symbol = ""
# catppuccin mocha palette
#style = "bold #eba0ac"

