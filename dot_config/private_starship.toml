"$schema" = 'https://starship.rs/config-schema.json'

# Sets user-defined palette
# palette = "catppuccin_macchiato"
# palette = "catppuccin_mocha"

# format = "$all"
format = """
$all\
$line_break\
$status\
$jobs\
$character\
"""

add_newline = false


[os]
disabled = true
format = "[$symbol](cyan) "

[os.symbols]
Ubuntu = "󰕈"
Artix = "󰣇"
Arch = "󰣇"
CachyOS = "󰣇"
Macos = ""

[character]
# '❯' '' '➜' '⟶' '❯' '▶'
# success_symbol = "[❯](bold green)"
# catppuccin mocha palette (https://lospec.com/palette-list/catppuccin-mocha)
# success_symbol = "[❯](bold #a6e3a1)"
# success_symbol = "[❯](bold dimmed green)"
# success_symbol = "[❯](dimmed green)"
success_symbol = "[❯](purple)"
# catppuccin mocha palette (https://lospec.com/palette-list/catppuccin-mocha)
# success_symbol = "[❯](bold #a6e3a1)"
#error_symbol = "[✗](bold red)"
# success_symbol = "[❯](green)(maroon)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
# success_symbol = "[❯](green)(maroon)"

[fill]
symbol = " "

[username]
# style_user = 'bold green'
# catppuccin mocha palette
#style_user = 'bold #a6e3a1'
# style_user = 'bold dimmed green'
# style_user = 'dimmed green'
style_user = "purple"
# style_user = 'bold green'
# catppuccin mocha palette
# style_user = 'bold #a6e3a1'
# show_always = true
# format = "[$user]($style)@"
format = "[$user]($style) "
# format = "[$user]($style)"

[hostname]
ssh_only = true
# format = "[@$hostname]($style) "
format = "@[$hostname]($style) "
# style = "bold bright-black"
# style = "bold yellow"
# style = 'bold dimmed green'
# style = 'bold dimmed green'
# catppuccin mocha palette
# style = 'bold dimmed green'
# style = 'dimmed green'
style = "purple"
# catppuccin mocha palette
# style = 'bold green'

