# make C-a prefix key like in screen
set -g prefix C-a
unbind C-b
bind a send-prefix # to reach a tmux running in a tmux

# Set the base index from which an unused index should be searched
# when a new window is created.  The default is zero.
set -g base-index 1
# let pane index begin at 1, not 0
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# backslash has to be escaped or quoted
bind '\' confirm-before kill-session # '

# bind space next-window
# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

bind -n M-H previous-window
bind -n M-L next-window

## bind Ctrl-a to switch between the last active window.
## To use this binding you would hit Ctrl-a twice
## (since the prefix is set to Ctrl-a and the binding Ctrl-a).
bind C-a last-window
#bind b last-window
#bind Tab last-window

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
#bind s split-window -v
#bind v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# move around panes with ALT+cursor key
bind-key -n M-Right select-pane -R
bind-key -n M-Left select-pane -L
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# so copy & paste with LMB/MMB works
set -g mouse on

# copy and paste like in vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind P paste-buffer

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf sourced"
# create new window and ssh into host "%1"
bind S command-prompt "new-window -n %1 'ssh %1'"

# and start tmux with param -2 to have mutt with 256 colors
set -g default-terminal "screen-256color"

set -g history-limit 50000

# these settings where wanted by nvim :checkhealth
set-option -sg escape-time 10
# set-option -sa terminal-overrides ',xterm-termite:RGB'
# set-option -sa terminal-overrides ',alacritty:RGB'
set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# set -g pane-active-border-style bg=default,fg=magenta
##set -g pane-active-border-style bg=default,fg=blue
# set -g pane-border-style fg=green
##set -g pane-border-style fg=colour8
# Set status bar
# set-option -g allow-rename off
set-window-option -g automatic-rename off
# set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "
#setw -g pane-border-format ' #{pane_index} #{pane_title} : #{pane_current_path} '

# enable Yazi's image preview to work correctly in tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Style the status bar
gray_light="#c8d3f5"
# gray_medium="#abb2bf"
gray_medium="#828bb8"
# gray_dark="#343B58"
gray_dark="#545c7e"
green_soft="#c3e88d"
# green_soft="#9ece6a"
# blue_muted="#82aaff"
blue_muted="#7aa2f7"
# cyan_soft="#c099ff"
cyan_soft="#7dcfff"

# set -g status-position top
set -g status-left-length 50
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold]| "
# set -g status-right "#T"
set -g status-right ""
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #I:#W"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark}, bg=${blue_muted}"

set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

